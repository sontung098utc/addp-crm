# ============================================================================
# NGINX - https://crm.addp.vn  (WBS-01)
#
# Phân luồng trên CÙNG một tên miền:
#   /                      -> portal (Next.js CRM)
#   Webhook kênh chat      -> javis  (Meta, Zalo OA cần đúng các đường dẫn này - docs/31, docs/35)
#   /gw/                   -> javis  (API nội bộ cho Portal gọi qua trình duyệt, sau SSO - WBS-09)
#
# LẦN ĐẦU chưa có chứng chỉ: scripts/init-ssl.sh tự dùng bản bootstrap (chỉ cổng 80) để xin cert.
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crm_portal { server portal:3000; keepalive 32; }
upstream crm_javis  { server javis:7777;  keepalive 32; }

# --- Cổng 80: chỉ phục vụ xác thực Let's Encrypt + chuyển hướng HTTPS ---
server {
    listen 80;
    server_name crm.addp.vn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- Cổng 443 ---
server {
    listen 443 ssl;
    http2 on;
    server_name crm.addp.vn;

    ssl_certificate     /etc/letsencrypt/live/crm.addp.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.addp.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;   # ảnh / file / ghi âm trong hội thoại

    # ---- Webhook & xác thực của các kênh chat -> Javis Gateway ----
    location = /messenger/webhook          { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }
    location = /zalo-oa/webhook            { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }
    location = /zalo-oa/site-verification  { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }
    location ~ ^/zalo_verifier[^/]*\.html$ { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }
    location = /whatsapp/webhook           { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }
    location = /connect/oauth/callback     { proxy_pass http://crm_javis; include /etc/nginx/snippets/proxy-common.conf; }

    # ---- API Gateway Javis cho Portal (bỏ tiền tố /gw) ----
    location /gw/ {
        proxy_pass http://crm_javis/;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ---- Mọi thứ còn lại -> CRM Portal ----
    location / {
        proxy_pass http://crm_portal;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
