# Cấu hình TẠM chỉ cổng 80 - dùng duy nhất lúc xin chứng chỉ SSL lần đầu (scripts/init-ssl.sh).
server {
    listen 80;
    server_name crm.addp.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 "ADDP CRM dang khoi tao SSL...\n"; add_header Content-Type text/plain; }
}
